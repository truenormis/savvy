{{- if .Values.httpRoute.enabled -}}
{{- if .Values.ingress.enabled -}}
{{- fail "savvy: enable either ingress OR httpRoute, not both — they would publish the same Service twice." -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "savvy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savvy.labels" . | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.httpRoute.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.httpRoute.rules }}
    {{- tpl (toYaml .Values.httpRoute.rules) . | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "savvy.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
    {{- end }}
{{- end }}
